[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "marked-register"
version = "0.1.0"
description = "Local-first marked register digitisation and review"
readme = "README.md"
license = "Apache-2.0"
requires-python = ">=3.12"
dependencies = [
    "alembic>=1.16",
    "fastapi>=0.116",
    "jinja2>=3.1",
    "numpy>=2.3",
    "opencv-python-headless>=4.13",
    "pymupdf>=1.26",
    "python-multipart>=0.0.20",
    "pytesseract>=0.3.13",
    "sqlalchemy>=2.0",
    "uvicorn>=0.35",
]

[project.optional-dependencies]
local-ai = ["mlx-vlm>=0.4.4"]

[project.scripts]
marked-register = "marked_register.cli:main"

[dependency-groups]
dev = [
    "httpx>=0.28",
    "pytest>=8.4",
    "ruff>=0.12",
]

[tool.hatch.build.targets.wheel]
packages = ["src/marked_register"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 99
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]

[tool.ruff.format]
quote-style = "double"
